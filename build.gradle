plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Minecraft Transit Railway (MTR) 依赖：从 Modrinth 下载后放入 libs/。
    // 说明：MTR 相关源码放在 src/mtr/java（平台类型检查器只扫 src/main/java）。
    // 必须用 modImplementation files(...)：让 loom 把 MTR 重映射成 yarn（内部 Minecraft 引用才能解析）；
    // 同时在 mixin 上用 @Mixin(..., remap = false)，避免 loom 对 MTR 方法名做混淆映射而报错。
    modImplementation files("libs/MTR-fabric-4.0.4+1.20.1.jar")
}

processResources {
    inputs.property "version", project.version
    // filter 同样按 filteringCharset 读写，不显式设成 UTF-8 时取平台默认
    // （容器里常是 ASCII），会把 description 里的中文破坏成非法 UTF-8：
    // Gradle 仍报 BUILD SUCCESSFUL，但最终 JAR 里的 JSON 已经坏了。
    filteringCharset = 'UTF-8'
    // 只替换版本占位符。Gradle expand 会把 JSON 字符串里的 \n 解释成真实换行，
    // 造成源文件合法、最终 JAR 中 fabric.mod.json 却损坏。
    filesMatching("fabric.mod.json") {
        filter { line -> line.replace('${version}', project.version.toString()) }
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
base { archivesName = project.archives_base_name }

sourceSets {
    main {
        java {
            srcDir 'src/mtr/java'
        }
    }
}
