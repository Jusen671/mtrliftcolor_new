name: unzip-to-root
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract to repo root
        run: |
          shopt -s dotglob
          for z in *.zip; do
            [ -e "$z" ] || continue
            tmp=$(mktemp -d)
            unzip -o "$z" -d "$tmp"
            # 如果解出来只有一个顶层文件夹，就拍平；否则整体放到根
            items=("$tmp"/*)
            if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
              mv "$tmp"/*/* .
            else
              mv "$tmp"/* .
            fi
            rm -rf "$tmp"
            rm -f "$z"
          done
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "auto unzip to root" || echo "no changes"
          git push
